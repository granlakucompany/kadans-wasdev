name: 💡 Feature request
description: Suggest a new scene type, animation capability or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your idea! You can write in English, French or Haitian Creole.

  - type: textarea
    id: need
    attributes:
      label: What would you like to do?
      description: Describe the need or the problem this feature would solve.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: How should it work in Kadans (`spec.json` syntax, CLI, or Studio Editor)?
    validations:
      required: true

  - type: checkboxes
    id: contribute
    attributes:
      label: Contribution
      options:
        - label: I would like to implement this feature myself (pull request).
